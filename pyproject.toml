[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyterhub-adapter"
version = "1.0.0"
description = "Standalone Python library and optional CLI for JupyterHub user, server, sharing, token, filesystem, and execution operations."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [{name = "EGI Foundation"}]
keywords = ["jupyterhub", "jupyter", "egi", "eosc"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "build>=1.0",
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "twine>=5.0",
    "types-requests>=2.28",
]

[project.scripts]
fedcloud-jupyterhub = "fedcloud_jupyterhub.cli:jupyterhub"

[project.urls]
Repository = "https://github.com/tdviet/jupyterhub-adapter"
Issues = "https://github.com/tdviet/jupyterhub-adapter/issues"

[tool.setuptools.packages.find]
include = ["fedcloud_jupyterhub*"]

[tool.setuptools.package-data]
fedcloud_jupyterhub = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP007", "UP035"]

[tool.mypy]
python_version = "3.8"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
packages = ["fedcloud_jupyterhub"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
